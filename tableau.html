<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tableau tactique BCSO</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #2468A8;
}

#map {
    width: 100%;
    height: 100%;
}

.leaflet-container {
    background: #2468A8;
}

.leaflet-container.mode-dessin {
    cursor: crosshair !important;
}

.leaflet-container.mode-gomme {
    cursor: not-allowed !important;
}

.leaflet-container.mode-selection {
    cursor: default !important;
}


/* =================================================
   EN-TÊTE
   ================================================= */

.header {

    position: absolute;
    z-index: 1200;

    top: 12px;
    left: 62px;

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 8px 12px;

    background: rgba(17, 30, 48, 0.96);

    color: white;

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 12px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,0.3);
}


.header img {

    width: 40px;
    height: 40px;

    object-fit: contain;
}


.header-title {

    font-size: 14px;

    font-weight: bold;
}


.header-subtitle {

    margin-top: 2px;

    font-size: 10px;

    color: #a9bfd3;
}


/* =================================================
   ÉTAT
   ================================================= */

.status {

    position: absolute;
    z-index: 1200;

    top: 12px;
    right: 12px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 9px 12px;

    background:
        rgba(17, 30, 48, 0.96);

    color: white;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,255,255,0.15);

    font-size: 11px;
}


.status-dot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #e0a43c;
}


.status-dot.online {
    background: #40c96b;
}


.status-dot.offline {
    background: #e34c4c;
}


/* =================================================
   OPÉRATIONS
   ================================================= */

.session {

    position: absolute;
    z-index: 1200;

    top: 65px;
    right: 12px;

    width: 290px;

    padding: 10px;

    background:
        rgba(17, 30, 48, 0.96);

    color: white;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,255,255,0.15);

    box-shadow:
        0 5px 18px
        rgba(0,0,0,0.25);
}


.session-title {

    margin-bottom: 7px;

    font-size: 11px;

    font-weight: bold;
}


.session-row {

    display: flex;

    gap: 6px;

    margin-top: 6px;
}


.session select,
.session input {

    width: 100%;

    min-width: 0;

    padding: 8px;

    color: white;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 7px;

    outline: none;
}


.session select option {
    color: black;
}


.tiny-btn {

    padding: 7px 9px;

    color: white;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 7px;

    cursor: pointer;

    white-space: nowrap;
}


.tiny-btn:hover {

    background:
        rgba(255,255,255,0.15);
}


.tiny-btn.danger {

    border-color:
        rgba(255,70,70,0.55);

    background:
        rgba(200,50,50,0.18);
}


/* =================================================
   BARRE D'OUTILS
   ================================================= */

.toolbar {

    position: absolute;

    z-index: 1200;

    left: 50%;
    bottom: 15px;

    transform:
        translateX(-50%);

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    align-items: center;

    gap: 7px;

    max-width:
        calc(100% - 30px);

    padding: 10px;

    background:
        rgba(17, 30, 48, 0.96);

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 13px;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,0.4);
}


.tool-button,
.action-button,
.toolbar select {

    min-height: 38px;

    padding: 8px 10px;

    color: white;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 8px;

    cursor: pointer;

    font-size: 12px;
}


.toolbar select option {
    color: black;
}


.tool-button:hover,
.action-button:hover {

    background:
        rgba(255,255,255,0.15);
}


.tool-button.active {

    background: #347fc1;
}


.danger {

    border-color:
        rgba(255,70,70,0.7);

    background:
        rgba(200,50,50,0.2);
}


.danger:hover {

    background:
        rgba(200,50,50,0.45);
}


.separator {

    width: 1px;
    height: 30px;

    margin: 0 3px;

    background:
        rgba(255,255,255,0.15);
}


#colorPicker {

    width: 40px;
    height: 38px;

    padding: 3px;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 8px;

    cursor: pointer;
}


.size-box {

    display: flex;

    align-items: center;

    gap: 7px;

    color: white;

    font-size: 11px;
}


#sizeRange {
    width: 100px;
}


/* =================================================
   TEXTE SUR LA CARTE
   ================================================= */

.map-text {

    white-space: nowrap;

    font-family:
        Arial,
        sans-serif;

    font-weight: bold;

    text-shadow:
        -1px -1px 0 black,
         1px -1px 0 black,
        -1px  1px 0 black,
         1px  1px 0 black,
         0 2px 4px
         rgba(0,0,0,0.75);

    transform:
        translate(
            -50%,
            -50%
        );

    user-select: none;
}


/* =================================================
   AIDE SÉLECTION
   ================================================= */

.selected-hint {

    position: absolute;

    z-index: 1200;

    left: 12px;
    bottom: 15px;

    padding: 8px 10px;

    background:
        rgba(17,30,48,0.96);

    color: #a9bfd3;

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 9px;

    font-size: 10px;
}


@media (max-width: 900px) {

    .toolbar {

        left: 8px;
        right: 8px;

        width: auto;

        transform: none;
    }

    .session {
        width: 230px;
    }

    .selected-hint {
        display: none;
    }

}

</style>
</head>


<body>


<div id="map"></div>


<div class="header">

    <img
        src="bcso.png"
        alt="BCSO"
        onerror="
            this.style.display='none'
        "
    >

    <div>

        <div class="header-title">
            Tableau tactique BCSO
        </div>

        <div class="header-subtitle">
            Carte opérationnelle collaborative
        </div>

    </div>

</div>


<div class="status">

    <span
        id="statusDot"
        class="status-dot"
    ></span>

    <span id="statusText">
        Initialisation...
    </span>

</div>



<!-- ===============================================
     GESTION DES OPÉRATIONS
     =============================================== -->

<div class="session">

    <div class="session-title">
        Opérations
    </div>


    <div class="session-row">

        <select id="operationSelect">
        </select>

        <button
            id="deleteOperation"
            class="tiny-btn danger"
            type="button"
        >
            Suppr.
        </button>

    </div>


    <div class="session-row">

        <input
            id="newOperation"
            maxlength="40"
            placeholder="Nom nouvelle opération"
        >

        <button
            id="createOperation"
            class="tiny-btn"
            type="button"
        >
            Créer
        </button>

    </div>


    <div class="session-row">

        <button
            id="copyOperationLink"
            class="tiny-btn"
            type="button"
            style="
                width:100%;
            "
        >
            Copier le lien de cette opération
        </button>

    </div>

</div>



<!-- ===============================================
     BARRE D'OUTILS
     =============================================== -->

<div class="toolbar">


    <button
        class="tool-button active"
        data-tool="navigate"
    >
        👆 Navigation
    </button>


    <button
        class="tool-button"
        data-tool="select"
    >
        ✥ Sélection / déplacer
    </button>


    <button
        class="tool-button"
        data-tool="pencil"
    >
        ✏️ Crayon
    </button>


    <button
        class="tool-button"
        data-tool="eraser"
    >
        🧽 Gomme
    </button>


    <div class="separator"></div>


    <button
        class="tool-button"
        data-tool="line"
    >
        ／ Ligne
    </button>


    <button
        class="tool-button"
        data-tool="arrow"
    >
        ➜ Flèche
    </button>


    <button
        class="tool-button"
        data-tool="circle"
    >
        ◯ Cercle
    </button>


    <button
        class="tool-button"
        data-tool="text"
    >
        T Texte
    </button>


    <div class="separator"></div>


    <input
        id="colorPicker"
        type="color"
        value="#ff3030"
        title="Couleur"
    >


    <div class="size-box">

        Taille

        <input
            id="sizeRange"
            type="range"
            min="2"
            max="24"
            value="6"
        >

        <strong id="sizeValue">
            6
        </strong>

    </div>


    <div class="separator"></div>


    <select id="mapStyle">

        <option value="carte">
            🗺️ Carte
        </option>

        <option value="routes">
            🛣️ Routes
        </option>

        <option value="atlas">
            🎨 Atlas
        </option>

        <option value="satellite">
            🛰️ Satellite
        </option>

    </select>


    <div class="separator"></div>


    <button
        id="undoButton"
        class="action-button"
    >
        ↶ Annuler
    </button>


    <button
        id="resetButton"
        class="action-button danger"
    >
        🗑 Reset
    </button>


</div>


<div class="selected-hint">

    ✥ Sélection / déplacer :
    clique puis fais glisser
    un texte, une ligne,
    une flèche, un cercle
    ou un dessin.

</div>



<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script type="module">


/* =================================================
   FIREBASE

   NE MODIFIE PAS ENCORE.
   ================================================= */

const firebaseConfig = {

    apiKey:
        "REMPLACE_MOI",

    authDomain:
        "REMPLACE_MOI.firebaseapp.com",

    databaseURL:
        "https://REMPLACE_MOI-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "REMPLACE_MOI",

    storageBucket:
        "REMPLACE_MOI.firebasestorage.app",

    messagingSenderId:
        "REMPLACE_MOI",

    appId:
        "REMPLACE_MOI"

};



import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
    getAuth,
    signInAnonymously
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import {
    getDatabase,
    ref,
    push,
    set,
    remove,
    onChildAdded,
    onChildChanged,
    onChildRemoved,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";



/* =================================================
   CARTE
   ================================================= */

const map =
    L.map(
        "map",
        {

            crs:
                L.CRS.Simple,

            minZoom:
                -2,

            maxZoom:
                4,

            doubleClickZoom:
                false

        }
    );


const largeur = 1280;
const hauteur = 1280;


const bounds = [

    [0, 0],

    [hauteur, largeur]

];



/* =================================================
   FONDS
   ================================================= */

const fonds = {

    carte:
        L.imageOverlay(
            "carte.png",
            bounds
        ),

    routes:
        L.imageOverlay(
            "routes.png",
            bounds
        ),

    atlas:
        L.imageOverlay(
            "atlas.png",
            bounds
        ),

    satellite:
        L.imageOverlay(
            "satellite.png",
            bounds
        )

};


let fondActuel =
    fonds.carte;


fondActuel
    .addTo(map);


fondActuel
    .bringToBack();


map.fitBounds(
    bounds
);


document
    .getElementById(
        "mapStyle"
    )
    .addEventListener(
        "change",
        function() {

            map.removeLayer(
                fondActuel
            );


            fondActuel =
                fonds[
                    this.value
                ];


            fondActuel
                .addTo(map);


            fondActuel
                .bringToBack();

        }
    );



/* =================================================
   ÉTAT
   ================================================= */

const state = {

    tool:
        "navigate",

    color:
        "#ff3030",

    weight:
        6,

    drawing:
        false,

    currentId:
        null,

    currentItem:
        null,

    firebaseReady:
        false,

    database:
        null,

    itemsRef:
        null,

    operationsRef:
        null,

    userId:
        "local-"
        +
        Math.random()
            .toString(36)
            .slice(2),

    room:
        "",

    layers:
        new Map(),

    data:
        new Map(),

    localData:
        {},

    ownHistory:
        [],

    moving:
        false,

    moveId:
        null,

    moveStart:
        null,

    moveBase:
        null

};


const mapEl =
    document
        .getElementById(
            "map"
        );



/* =================================================
   OPÉRATIONS
   ================================================= */

function cleanRoom(
    value
) {

    return (
        value
        ||
        ""
    )
    .trim()
    .toLowerCase()
    .normalize(
        "NFD"
    )
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .replace(
        /[^a-z0-9_-]+/g,
        "-"
    )
    .replace(
        /^-+|-+$/g,
        ""
    )
    .slice(
        0,
        40
    )
    ||
    "operation-nord";

}



function roomFromUrl() {

    return cleanRoom(

        new URLSearchParams(
            location.search
        )
        .get(
            "room"
        )

        ||

        "operation-nord"

    );

}



function roomUrl(
    room = state.room
) {

    const url =
        new URL(
            location.href
        );


    url
        .searchParams
        .set(
            "room",
            room
        );


    return url
        .toString();

}



function goRoom(
    room
) {

    location.href =
        roomUrl(
            cleanRoom(
                room
            )
        );

}



const OPERATIONS_KEY =
    "bcso-operations-v2";



function localOperations() {

    try {

        return JSON.parse(

            localStorage
                .getItem(
                    OPERATIONS_KEY
                )

            ||

            "[]"

        );

    }

    catch {

        return [];

    }

}



function saveLocalOperations(
    operations
) {

    localStorage
        .setItem(

            OPERATIONS_KEY,

            JSON.stringify(

                [
                    ...new Set(
                        operations
                    )
                ]

            )

        );

}



function renderOperations(
    operations
) {

    const select =
        document
            .getElementById(
                "operationSelect"
            );


    const liste =
        [
            ...new Set(
                [
                    state.room,
                    ...operations
                ]
            )
        ]
        .sort();


    select.innerHTML =
        "";


    liste
        .forEach(
            function(
                room
            ) {

                const option =
                    document
                        .createElement(
                            "option"
                        );


                option.value =
                    room;


                option.textContent =
                    room;


                option.selected =
                    room
                    ===
                    state.room;


                select
                    .appendChild(
                        option
                    );

            }
        );

}



function ensureLocalOperation(
    room
) {

    const operations =
        localOperations();


    if (
        !operations
            .includes(
                room
            )
    ) {

        operations.push(
            room
        );


        saveLocalOperations(
            operations
        );

    }


    renderOperations(
        operations
    );

}



state.room =
    roomFromUrl();


ensureLocalOperation(
    state.room
);



document
    .getElementById(
        "operationSelect"
    )
    .addEventListener(
        "change",
        function(
            event
        ) {

            goRoom(
                event.target.value
            );

        }
    );



document
    .getElementById(
        "createOperation"
    )
    .addEventListener(
        "click",
        async function() {

            const input =
                document
                    .getElementById(
                        "newOperation"
                    );


            const room =
                cleanRoom(
                    input.value
                );


            const operations =
                localOperations();


            if (
                !operations
                    .includes(
                        room
                    )
            ) {

                operations.push(
                    room
                );


                saveLocalOperations(
                    operations
                );

            }


            if (
                state.firebaseReady
                &&
                state.operationsRef
            ) {

                await set(

                    ref(
                        state.operationsRef,
                        room
                    ),

                    {

                        name:
                            room,

                        createdAt:
                            Date.now()

                    }

                );

            }


            goRoom(
                room
            );

        }
    );



document
    .getElementById(
        "newOperation"
    )
    .addEventListener(
        "keydown",
        function(
            event
        ) {

            if (
                event.key
                ===
                "Enter"
            ) {

                document
                    .getElementById(
                        "createOperation"
                    )
                    .click();

            }

        }
    );



document
    .getElementById(
        "deleteOperation"
    )
    .addEventListener(
        "click",
        async function() {

            const confirmation =
                confirm(
                    `Supprimer l'opération "${state.room}" et tous ses dessins ?`
                );


            if (
                !confirmation
            ) {

                return;

            }


            const operations =
                localOperations()
                    .filter(
                        operation =>
                            operation
                            !==
                            state.room
                    );


            saveLocalOperations(
                operations
            );


            localStorage
                .removeItem(
                    "bcso-tableau-"
                    +
                    state.room
                );


            if (
                state.firebaseReady
                &&
                state.database
            ) {

                await remove(

                    ref(
                        state.database,
                        `tableaux/${state.room}`
                    )

                );


                if (
                    state.operationsRef
                ) {

                    await remove(

                        ref(
                            state.operationsRef,
                            state.room
                        )

                    );

                }

            }


            goRoom(
                operations[0]
                ||
                "operation-nord"
            );

        }
    );



document
    .getElementById(
        "copyOperationLink"
    )
    .addEventListener(
        "click",
        async function() {

            try {

                await navigator
                    .clipboard
                    .writeText(
                        roomUrl()
                    );


                alert(
                    "Lien copié"
                );

            }

            catch {

                prompt(
                    "Copie ce lien :",
                    roomUrl()
                );

            }

        }
    );



/* =================================================
   OUTILS
   ================================================= */

const toolButtons = [

    ...document
        .querySelectorAll(
            "[data-tool]"
        )

];



function setTool(
    tool
) {

    state.tool =
        tool;


    toolButtons
        .forEach(
            function(
                button
            ) {

                button
                    .classList
                    .toggle(

                        "active",

                        button
                            .dataset
                            .tool
                        ===
                        tool

                    );

            }
        );


    mapEl
        .classList
        .remove(

            "mode-dessin",

            "mode-gomme",

            "mode-selection"

        );


    if (
        tool
        ===
        "navigate"
    ) {

        map
            .dragging
            .enable();

    }

    else {

        map
            .dragging
            .disable();


        mapEl
            .classList
            .add(

                tool
                ===
                "eraser"

                    ?

                    "mode-gomme"

                    :

                tool
                ===
                "select"

                    ?

                    "mode-selection"

                    :

                    "mode-dessin"

            );

    }

}



toolButtons
    .forEach(
        function(
            button
        ) {

            button
                .addEventListener(
                    "click",
                    function() {

                        setTool(
                            button
                                .dataset
                                .tool
                        );

                    }
                );

        }
    );



document
    .getElementById(
        "colorPicker"
    )
    .addEventListener(
        "input",
        function(
            event
        ) {

            state.color =
                event.target.value;

        }
    );



document
    .getElementById(
        "sizeRange"
    )
    .addEventListener(
        "input",
        function(
            event
        ) {

            state.weight =
                Number(
                    event.target.value
                );


            document
                .getElementById(
                    "sizeValue"
                )
                .textContent =
                event.target.value;

        }
    );



/* =================================================
   UTILITAIRES
   ================================================= */

function ll(
    latlng
) {

    return [

        Math.round(
            latlng.lat
            *
            10
        )
        /
        10,

        Math.round(
            latlng.lng
            *
            10
        )
        /
        10

    ];

}



function toLatLng(
    point
) {

    return L.latLng(
        point[0],
        point[1]
    );

}



function clone(
    object
) {

    return JSON.parse(
        JSON.stringify(
            object
        )
    );

}



function escapeHtml(
    text
) {

    return String(
        text
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}



function newId() {

    if (
        state.firebaseReady
        &&
        state.itemsRef
    ) {

        return push(
            state.itemsRef
        ).key;

    }


    return (
        "local-"
        +
        Date.now()
        +
        "-"
        +
        Math.random()
            .toString(36)
            .slice(2)
    );

}



/* =================================================
   SAUVEGARDE LOCALE
   ================================================= */

function localKey() {

    return (
        "bcso-tableau-"
        +
        state.room
    );

}



function saveLocal() {

    localStorage
        .setItem(

            localKey(),

            JSON.stringify(
                state.localData
            )

        );

}



function loadLocal() {

    try {

        state.localData =
            JSON.parse(

                localStorage
                    .getItem(
                        localKey()
                    )

                ||

                "{}"

            );

    }

    catch {

        state.localData =
            {};

    }


    Object
        .entries(
            state.localData
        )
        .forEach(
            function(
                [id, item]
            ) {

                renderItem(
                    id,
                    item
                );

            }
        );

}



/* =================================================
   SAUVEGARDE
   ================================================= */

async function saveItem(
    id,
    item
) {

    state.data
        .set(
            id,
            item
        );


    if (
        state.firebaseReady
        &&
        state.itemsRef
    ) {

        await set(

            ref(
                state.itemsRef,
                id
            ),

            item

        );

    }

    else {

        state.localData[
            id
        ] =
            item;


        renderItem(
            id,
            item
        );


        saveLocal();

    }

}



async function liveSave(
    id,
    item
) {

    if (
        state.firebaseReady
        &&
        state.itemsRef
    ) {

        await set(

            ref(
                state.itemsRef,
                id
            ),

            item

        );

    }

}



async function deleteItem(
    id
) {

    if (
        !id
    ) {

        return;

    }


    if (
        state.firebaseReady
        &&
        state.itemsRef
    ) {

        await remove(

            ref(
                state.itemsRef,
                id
            )

        );

    }

    else {

        delete state.localData[
            id
        ];


        removeRendered(
            id
        );


        saveLocal();

    }

}



/* =================================================
   RETIRER UN OBJET
   ================================================= */

function removeRendered(
    id
) {

    const layer =
        state.layers
            .get(
                id
            );


    if (
        layer
    ) {

        map.removeLayer(
            layer
        );


        state.layers
            .delete(
                id
            );

    }


    state.data
        .delete(
            id
        );

}



/* =================================================
   DÉPLACEMENT / SÉLECTION
   ================================================= */

function startMove(
    id,
    event
) {

    if (
        state.tool
        !==
        "select"
    ) {

        return;

    }


    const item =
        state.data
            .get(
                id
            );


    if (
        !item
    ) {

        return;

    }


    L.DomEvent
        .stopPropagation(
            event
        );


    state.moving =
        true;


    state.moveId =
        id;


    state.moveStart =
        ll(
            event.latlng
        );


    state.moveBase =
        clone(
            item
        );

}



function translateItem(
    item,
    deltaLat,
    deltaLng
) {

    const result =
        clone(
            item
        );


    function movePair(
        point
    ) {

        return [

            Math.round(
                (
                    point[0]
                    +
                    deltaLat
                )
                *
                10
            )
            /
            10,

            Math.round(
                (
                    point[1]
                    +
                    deltaLng
                )
                *
                10
            )
            /
            10

        ];

    }


    if (
        result.points
    ) {

        result.points =
            result.points
                .map(
                    movePair
                );

    }


    if (
        result.center
    ) {

        result.center =
            movePair(
                result.center
            );

    }


    if (
        result.edge
    ) {

        result.edge =
            movePair(
                result.edge
            );

    }


    if (
        result.position
    ) {

        result.position =
            movePair(
                result.position
            );

    }


    return result;

}



/* =================================================
   ÉVÉNEMENTS OBJETS
   ================================================= */

function bindObjectEvents(
    layer,
    id
) {

    layer.on(
        "click",
        async function(
            event
        ) {

            if (
                state.tool
                !==
                "eraser"
            ) {

                return;

            }


            L.DomEvent
                .stopPropagation(
                    event
                );


            await deleteItem(
                id
            );

        }
    );


    layer.on(
        "mousedown",
        function(
            event
        ) {

            startMove(
                id,
                event
            );

        }
    );

}



/* =================================================
   ANGLE FLÈCHE
   ================================================= */

function arrowAngle(
    a,
    b
) {

    const p1 =
        map.latLngToLayerPoint(
            a
        );


    const p2 =
        map.latLngToLayerPoint(
            b
        );


    return Math.atan2(

        p2.y
        -
        p1.y,

        p2.x
        -
        p1.x

    )
    *
    180
    /
    Math.PI;

}



/* =================================================
   CRÉATION DES OBJETS VISUELS
   ================================================= */

function buildLayer(
    id,
    item
) {

    const options = {

        color:
            item.color
            ||
            "#ff3030",

        weight:
            item.weight
            ||
            6,

        opacity:
            0.95,

        lineCap:
            "round",

        lineJoin:
            "round"

    };



    /* CRAYON / LIGNE */

    if (
        item.type
        ===
        "pencil"
        ||
        item.type
        ===
        "line"
    ) {

        const layer =
            L.polyline(

                (
                    item.points
                    ||
                    []
                )
                .map(
                    toLatLng
                ),

                options

            );


        bindObjectEvents(
            layer,
            id
        );


        return layer;

    }



    /* FLÈCHE */

    if (
        item.type
        ===
        "arrow"
    ) {

        const points =
            (
                item.points
                ||
                []
            )
            .map(
                toLatLng
            );


        const group =
            L.layerGroup();


        const line =
            L.polyline(
                points,
                options
            );


        group.addLayer(
            line
        );


        if (
            points.length
            >=
            2
        ) {

            const end =
                points[
                    points.length
                    -
                    1
                ];


            const previous =
                points[
                    points.length
                    -
                    2
                ];


            const angle =
                arrowAngle(
                    previous,
                    end
                );


            /*
                La taille de la pointe
                dépend maintenant de
                l'épaisseur.
            */

            const headHeight =
                Math.max(
                    16,
                    options.weight
                    *
                    2.7
                );


            const headWidth =
                Math.max(
                    22,
                    options.weight
                    *
                    3.4
                );


            const icon =
                L.divIcon({

                    className:
                        "",

                    html:
                        `
                        <div
                            style="
                                width:0;
                                height:0;

                                border-top:
                                ${headHeight / 2}px
                                solid transparent;

                                border-bottom:
                                ${headHeight / 2}px
                                solid transparent;

                                border-left:
                                ${headWidth}px
                                solid
                                ${options.color};

                                transform:
                                rotate(${angle}deg);

                                transform-origin:
                                50% 50%;

                                filter:
                                drop-shadow(
                                    0 1px 1px
                                    rgba(0,0,0,0.65)
                                );
                            "
                        ></div>
                        `,

                    iconSize: [

                        headWidth
                        +
                        6,

                        headHeight
                        +
                        6

                    ],

                    iconAnchor: [

                        (
                            headWidth
                            +
                            6
                        )
                        /
                        2,

                        (
                            headHeight
                            +
                            6
                        )
                        /
                        2

                    ]

                });


            group.addLayer(

                L.marker(
                    end,
                    {

                        icon:
                            icon,

                        interactive:
                            true

                    }
                )

            );

        }


        group
            .eachLayer(
                function(
                    layer
                ) {

                    bindObjectEvents(
                        layer,
                        id
                    );

                }
            );


        return group;

    }



    /* CERCLE */

    if (
        item.type
        ===
        "circle"
    ) {

        const center =
            toLatLng(
                item.center
            );


        const edge =
            toLatLng(
                item.edge
            );


        const layer =
            L.circle(
                center,
                {

                    ...options,

                    radius:
                        map.distance(
                            center,
                            edge
                        ),

                    fill:
                        false

                }
            );


        bindObjectEvents(
            layer,
            id
        );


        return layer;

    }



    /* TEXTE */

    if (
        item.type
        ===
        "text"
    ) {

        const icon =
            L.divIcon({

                className:
                    "",

                html:
                    `
                    <div
                        class="map-text"

                        style="
                            color:
                            ${item.color || "#ffffff"};

                            font-size:
                            ${Math.max(
                                14,
                                (item.weight || 6)
                                *
                                2
                                +
                                5
                            )}px;
                        "
                    >
                        ${escapeHtml(
                            item.text
                            ||
                            ""
                        )}
                    </div>
                    `,

                iconAnchor:
                    [0,0]

            });


        const marker =
            L.marker(

                toLatLng(
                    item.position
                ),

                {

                    icon:
                        icon,

                    interactive:
                        true

                }

            );


        bindObjectEvents(
            marker,
            id
        );


        return marker;

    }


    return null;

}



/* =================================================
   AFFICHAGE
   ================================================= */

function renderItem(
    id,
    item
) {

    removeRendered(
        id
    );


    const layer =
        buildLayer(
            id,
            item
        );


    if (
        !layer
    ) {

        return;

    }


    layer.addTo(
        map
    );


    state.layers
        .set(
            id,
            layer
        );


    state.data
        .set(
            id,
            item
        );

}



/* =================================================
   DESSIN
   ================================================= */

let lastLiveSave =
    0;



function itemBase(
    type
) {

    return {

        type:
            type,

        color:
            state.color,

        weight:
            state.weight,

        owner:
            state.userId,

        createdAt:
            Date.now()

    };

}



async function startDrawing(
    event
) {

    if (
        [
            "navigate",
            "select",
            "eraser",
            "text"
        ]
        .includes(
            state.tool
        )
    ) {

        return;

    }


    state.drawing =
        true;


    state.currentId =
        newId();


    const start =
        ll(
            event.latlng
        );


    if (
        state.tool
        ===
        "pencil"
    ) {

        state.currentItem = {

            ...itemBase(
                "pencil"
            ),

            points:
                [
                    start
                ]

        };

    }


    if (
        state.tool
        ===
        "line"
        ||
        state.tool
        ===
        "arrow"
    ) {

        state.currentItem = {

            ...itemBase(
                state.tool
            ),

            points:
                [
                    start,
                    start
                ]

        };

    }


    if (
        state.tool
        ===
        "circle"
    ) {

        state.currentItem = {

            ...itemBase(
                "circle"
            ),

            center:
                start,

            edge:
                start

        };

    }


    state.ownHistory
        .push(
            state.currentId
        );


    renderItem(

        state.currentId,

        state.currentItem

    );

}



/* =================================================
   MOUVEMENT SOURIS
   ================================================= */

async function moveDrawing(
    event
) {


    /* DÉPLACEMENT D'UN OBJET */

    if (
        state.moving
    ) {

        const current =
            ll(
                event.latlng
            );


        const deltaLat =
            current[0]
            -
            state.moveStart[0];


        const deltaLng =
            current[1]
            -
            state.moveStart[1];


        const moved =
            translateItem(

                state.moveBase,

                deltaLat,

                deltaLng

            );


        renderItem(

            state.moveId,

            moved

        );


        const now =
            Date.now();


        if (
            now
            -
            lastLiveSave
            >
            120
        ) {

            lastLiveSave =
                now;


            await liveSave(

                state.moveId,

                moved

            );

        }


        return;

    }



    /* DESSIN NORMAL */

    if (
        !state.drawing
        ||
        !state.currentItem
    ) {

        return;

    }


    const position =
        ll(
            event.latlng
        );


    if (
        state.currentItem.type
        ===
        "pencil"
    ) {

        const points =
            state.currentItem
                .points;


        const last =
            points[
                points.length
                -
                1
            ];


        if (
            Math.abs(
                last[0]
                -
                position[0]
            )
            +
            Math.abs(
                last[1]
                -
                position[1]
            )
            <
            1
        ) {

            return;

        }


        points.push(
            position
        );

    }



    if (
        state.currentItem.type
        ===
        "line"
        ||
        state.currentItem.type
        ===
        "arrow"
    ) {

        state.currentItem
            .points[1] =
            position;

    }



    if (
        state.currentItem.type
        ===
        "circle"
    ) {

        state.currentItem
            .edge =
            position;

    }



    renderItem(

        state.currentId,

        state.currentItem

    );


    const now =
        Date.now();


    if (
        now
        -
        lastLiveSave
        >
        120
    ) {

        lastLiveSave =
            now;


        await liveSave(

            state.currentId,

            state.currentItem

        );

    }

}



/* =================================================
   FIN INTERACTION
   ================================================= */

async function finishInteraction() {


    /* FIN DÉPLACEMENT */

    if (
        state.moving
    ) {

        const id =
            state.moveId;


        const item =
            state.data
                .get(
                    id
                );


        state.moving =
            false;


        state.moveId =
            null;


        state.moveStart =
            null;


        state.moveBase =
            null;


        if (
            item
        ) {

            await saveItem(
                id,
                item
            );

        }


        return;

    }



    /* FIN DESSIN */

    if (
        !state.drawing
        ||
        !state.currentItem
    ) {

        return;

    }


    state.drawing =
        false;


    await saveItem(

        state.currentId,

        state.currentItem

    );


    state.currentId =
        null;


    state.currentItem =
        null;

}



map.on(
    "mousedown",
    startDrawing
);


map.on(
    "mousemove",
    moveDrawing
);


map.on(
    "mouseup",
    finishInteraction
);


map.on(
    "mouseout",
    finishInteraction
);



/* =================================================
   TEXTE
   ================================================= */

map.on(
    "click",
    async function(
        event
    ) {

        if (
            state.tool
            !==
            "text"
        ) {

            return;

        }


        const text =
            prompt(
                "Texte à placer :"
            );


        if (
            !text
            ||
            !text.trim()
        ) {

            return;

        }


        const id =
            newId();


        const item = {

            ...itemBase(
                "text"
            ),

            text:
                text
                .trim()
                .slice(
                    0,
                    80
                ),

            position:
                ll(
                    event.latlng
                )

        };


        state.ownHistory
            .push(
                id
            );


        await saveItem(
            id,
            item
        );

    }
);



/* =================================================
   ANNULER
   ================================================= */

document
    .getElementById(
        "undoButton"
    )
    .addEventListener(
        "click",
        async function() {

            while (
                state.ownHistory
                    .length
            ) {

                const id =
                    state.ownHistory
                        .pop();


                if (
                    state.data
                        .has(
                            id
                        )
                    ||
                    state.localData[
                        id
                    ]
                ) {

                    await deleteItem(
                        id
                    );


                    return;

                }

            }

        }
    );



/* =================================================
   RESET
   ================================================= */

document
    .getElementById(
        "resetButton"
    )
    .addEventListener(
        "click",
        async function() {

            const confirmation =
                confirm(
                    `Supprimer TOUS les dessins de l'opération "${state.room}" ?`
                );


            if (
                !confirmation
            ) {

                return;

            }


            if (
                state.firebaseReady
                &&
                state.itemsRef
            ) {

                await remove(
                    state.itemsRef
                );

            }

            else {

                state.localData =
                    {};


                saveLocal();


                [
                    ...state.layers
                        .keys()
                ]
                .forEach(
                    removeRendered
                );

            }


            state.ownHistory =
                [];

        }
    );



/* =================================================
   FIREBASE
   ================================================= */

function firebaseConfigured() {

    return (

        firebaseConfig.apiKey

        &&

        !firebaseConfig
            .apiKey
            .includes(
                "REMPLACE"
            )

        &&

        firebaseConfig
            .databaseURL

    );

}



async function startFirebase() {

    const dot =
        document
            .getElementById(
                "statusDot"
            );


    const text =
        document
            .getElementById(
                "statusText"
            );



    /* MODE LOCAL */

    if (
        !firebaseConfigured()
    ) {

        dot
            .classList
            .add(
                "offline"
            );


        text.textContent =
            "Mode local";


        loadLocal();


        return;

    }



    /* MODE FIREBASE */

    try {

        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(
                app
            );


        const credential =
            await signInAnonymously(
                auth
            );


        state.userId =
            credential.user.uid;


        state.database =
            getDatabase(
                app
            );


        state.itemsRef =
            ref(

                state.database,

                `tableaux/${state.room}/dessins`

            );


        state.operationsRef =
            ref(
                state.database,
                "operations"
            );


        state.firebaseReady =
            true;


        dot
            .classList
            .add(
                "online"
            );


        text.textContent =
            "Temps réel connecté";



        /*
            Enregistre automatiquement
            l'opération actuelle.
        */

        await set(

            ref(
                state.operationsRef,
                state.room
            ),

            {

                name:
                    state.room,

                updatedAt:
                    Date.now()

            }

        );



        /*
            Synchronise la liste
            des opérations.
        */

        onValue(

            state.operationsRef,

            function(
                snapshot
            ) {

                const firebaseOperations =
                    Object.keys(
                        snapshot.val()
                        ||
                        {}
                    );


                const operations = [

                    ...new Set(

                        [

                            ...localOperations(),

                            ...firebaseOperations,

                            state.room

                        ]

                    )

                ];


                saveLocalOperations(
                    operations
                );


                renderOperations(
                    operations
                );

            }

        );



        /* DESSINS */

        onChildAdded(

            state.itemsRef,

            function(
                snapshot
            ) {

                renderItem(

                    snapshot.key,

                    snapshot.val()

                );

            }

        );


        onChildChanged(

            state.itemsRef,

            function(
                snapshot
            ) {

                renderItem(

                    snapshot.key,

                    snapshot.val()

                );

            }

        );


        onChildRemoved(

            state.itemsRef,

            function(
                snapshot
            ) {

                removeRendered(
                    snapshot.key
                );

            }

        );

    }


    catch (
        error
    ) {

        console.error(
            error
        );


        dot
            .classList
            .add(
                "offline"
            );


        text.textContent =
            "Firebase non connecté";


        loadLocal();

    }

}



startFirebase();


</script>
