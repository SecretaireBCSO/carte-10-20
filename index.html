<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carte 10-20</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #2468a8;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Couleur autour de la carte */
        .leaflet-container {
            background: #2468a8;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Création de la carte
    const map = L.map("map", {
        crs: L.CRS.Simple,
        minZoom: -2,
        maxZoom: 4
    });

    // Taille de l'image GTA
    const largeur = 1280;
    const hauteur = 1280;

    const bounds = [
        [0, 0],
        [hauteur, largeur]
    ];

    // Affichage de l'image
    L.imageOverlay("carte.png", bounds).addTo(map);

    // Centre automatiquement la carte
    map.fitBounds(bounds);
</script>

</body>
</html>
