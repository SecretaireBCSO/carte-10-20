<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carte 10-20</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #2468A8;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .leaflet-container {
            background: #2468A8;
        }

        /* =========================
           PANEL
        ========================= */

        .filters-control {
            font-family: Arial, sans-serif;
        }

        .filters-button {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(17, 30, 48, 0.96);
            color: white;

            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;

            font-size: 22px;
            cursor: pointer;

            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        }

        .filters-button:hover {
            background: #244b70;
        }

        .filters-panel {
            width: 275px;
            margin-top: 8px;

            background: rgba(17, 30, 48, 0.97);
            color: white;

            border-radius: 12px;
            overflow: hidden;

            border: 1px solid rgba(255,255,255,0.12);

            box-shadow: 0 8px 28px rgba(0,0,0,0.4);
        }

        .filters-panel.hidden {
            display: none;
        }

        .filters-header {
            padding: 14px 16px;

            background: rgba(36,104,168,0.35);

            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .filters-title {
            font-size: 15px;
            font-weight: bold;
        }

        .filters-subtitle {
            margin-top: 3px;
            font-size: 11px;
            color: #a9bfd3;
        }

        .filters-list {
            padding: 10px;
        }

        .filter-item {
            display: flex;
            align-items: center;

            padding: 8px;

            border-radius: 7px;

            font-size: 13px;
            cursor: pointer;
        }

        .filter-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .filter-item input {
            width: 16px;
            height: 16px;

            margin-right: 8px;

            cursor: pointer;
        }

        .filter-all {
            font-weight: bold;
        }

        .separator {
            height: 1px;
            margin: 7px 4px;

            background: rgba(255,255,255,0.1);
        }

        .legend-dot {
            width: 11px;
            height: 11px;

            border-radius: 50%;

            margin-right: 8px;

            border: 1px solid rgba(255,255,255,0.8);
        }

        /* =========================
           POINTS SUR LA CARTE
        ========================= */

        .map-dot {
            width: 16px;
            height: 16px;

            border-radius: 50%;

            border: 2px solid #111;

            box-shadow:
                0 1px 4px rgba(0,0,0,0.8),
                0 0 3px rgba(255,255,255,0.5);
        }

        /* =========================
           POPUP 10-20
        ========================= */

        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .leaflet-popup-content {
            margin: 12px;
            width: 300px !important;
        }

        .popup-card {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .popup-title {
            margin-bottom: 9px;

            font-size: 15px;
            font-weight: bold;

            color: #222;
        }

        .popup-image {
            display: block;

            width: 100%;
            height: 165px;

            object-fit: cover;

            border-radius: 9px;
        }

        .popup-zone {
            margin-top: 8px;

            font-size: 11px;

            color: #777;
        }

        /* Frontières */
        .frontiere-row {
            margin-top: 6px;
            padding-top: 8px;

            border-top: 1px solid rgba(255,255,255,0.12);

            font-weight: bold;
        }
    
        /* =========================
           LOGO BCSO
        ========================= */

        .bcso-logo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;

            background: rgba(17, 30, 48, 0.92);
            padding: 8px;

            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);

            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
        }

        .bcso-logo img {
            display: block;
            width: 72px;
            height: auto;
        }

        .bcso-logo:hover {
            transform: scale(1.03);
            transition: 0.15s;
        }

/* =========================
           BOUTON TABLEAU TACTIQUE
        ========================= */

        .tableau-link {
            position: absolute;
            bottom: 20px;
            left: 115px;
            z-index: 1000;

            padding: 12px 16px;

            background: rgba(17, 30, 48, 0.96);
            color: white;

            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;

            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;

            text-decoration: none;

            box-shadow: 0 6px 18px rgba(0,0,0,0.35);

            transition: 0.15s;
        }

        .tableau-link:hover {
            background: #347fc1;
            transform: translateY(-2px);
        }

        
    </style>
</head>

<body>

<div id="map"></div>


<div class="bcso-logo">
    <img src="bcso.png" alt="Logo BCSO">
</div>

<a
    href="tableau.html"
    class="tableau-link"
>
    🗺️ Tableau tactique
</a>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    /* =================================================
       CARTE
       ================================================= */

    const map = L.map("map", {
        crs: L.CRS.Simple,
        minZoom: -2,
        maxZoom: 4
    });

    const largeur = 1280;
    const hauteur = 1280;

    const bounds = [
        [0, 0],
        [hauteur, largeur]
    ];

    /* =================================================
       FONDS DE CARTE
       ================================================= */

    const fondsCarte = {

        carte: L.imageOverlay(
            "carte.png",
            bounds
        ),

        routes: L.imageOverlay(
            "routes.png",
            bounds
        ),

        atlas: L.imageOverlay(
            "atlas.png",
            bounds
        ),

        satellite: L.imageOverlay(
            "satellite.png",
            bounds
        )

    };

    // Fond affiché au démarrage
    let fondActuel = fondsCarte.carte;

    fondActuel.addTo(map);
    fondActuel.bringToBack();

    map.fitBounds(bounds);


    /* =================================================
       CHANGEMENT DU FOND
       ================================================= */

    function changerFond(type) {

        if (!fondsCarte[type]) {
            return;
        }

        map.removeLayer(fondActuel);

        fondActuel = fondsCarte[type];

        fondActuel.addTo(map);
        fondActuel.bringToBack();

        // Sur la carte "Routes", on masque automatiquement tous les 10-20.
        if (type === "routes") {

            Object.values(groupes).forEach(function(groupe) {

                if (map.hasLayer(groupe)) {
                    map.removeLayer(groupe);
                }

            });

        } else {

            // Quand on revient sur une autre carte,
            // on réaffiche uniquement les catégories cochées.
            document
                .querySelectorAll("[data-zone]")
                .forEach(function(checkbox) {

                    const zone = checkbox.dataset.zone;

                    if (checkbox.checked) {

                        if (!map.hasLayer(groupes[zone])) {
                            groupes[zone].addTo(map);
                        }

                    } else {

                        if (map.hasLayer(groupes[zone])) {
                            map.removeLayer(groupes[zone]);
                        }

                    }

                });

        }
    }


    /* =================================================
       CATÉGORIES
       ================================================= */

    const categories = {

        paletoBay: {
            nom: "Paleto Bay",
            couleur: "#1685FF"
        },

        oceanZancudo: {
            nom: "Ocean Highway / Zancudo",
            couleur: "#7B2CBF"
        },

        route68Harmony: {
            nom: "Route 68 / Harmony",
            couleur: "#35C759"
        },

        sandyJoshua: {
            nom: "Sandy Shores / Joshua Road",
            couleur: "#FF8C24"
        },

        senoraRoad: {
            nom: "Senora Road",
            couleur: "#FFCA28"
        },

        grapeseed: {
            nom: "Grapeseed",
            couleur: "#78D64B"
        },

        senoraFreeway: {
            nom: "Senora Freeway",
            couleur: "#19C4D8"
        },

        chiliadNord: {
            nom: "Mont Chiliad / Nord rural",
            couleur: "#D5D5D5"
        },

        frontieres: {
            nom: "Frontières",
            couleur: "#FF3030"
        }

    };


    /* =================================================
       GROUPES LEAFLET
       ================================================= */

    const groupes = {};

    Object.keys(categories).forEach(function(zone) {

        groupes[zone] =
            L.layerGroup().addTo(map);

    });


    /* =================================================
       PANEL DES FILTRES
       ================================================= */

    const FiltersControl = L.Control.extend({

        options: {
            position: "topright"
        },

        onAdd: function() {

            const container =
                L.DomUtil.create(
                    "div",
                    "filters-control"
                );

            let lignesCategories = "";

            Object.entries(categories)
                .forEach(function([id, categorie]) {

                    const frontiere =
                        id === "frontieres"
                        ? " frontiere-row"
                        : "";

                    lignesCategories += `

                        <label class="filter-item${frontiere}">

                            <input
                                type="checkbox"
                                data-zone="${id}"
                                checked
                            >

                            <span
                                class="legend-dot"
                                style="
                                    background:
                                    ${categorie.couleur}
                                "
                            ></span>

                            ${categorie.nom}

                        </label>
                    `;

                });


            container.innerHTML = `

                <button
                    id="filtersButton"
                    class="filters-button"
                    title="Filtres"
                >
                    ☰
                </button>

                <div
                    id="filtersPanel"
                    class="filters-panel hidden"
                >

                    <div class="filters-header">

                        <div class="filters-title">
                            Filtres 10-20
                        </div>

                        <div class="filters-subtitle">
                            Blaine County / Nord
                        </div>

                    </div>

                    <div class="filters-list">

                        <div style="
                            font-size: 11px;
                            text-transform: uppercase;
                            color: #8fa8bd;
                            font-weight: bold;
                            margin: 4px 8px 7px 8px;
                        ">
                            Fond de carte
                        </div>

                        <label class="filter-item">
                            <input
                                type="radio"
                                name="mapStyle"
                                value="carte"
                                checked
                            >
                            🗺️ Carte
                        </label>

                        <label class="filter-item">
                            <input
                                type="radio"
                                name="mapStyle"
                                value="routes"
                            >
                            🛣️ Routes
                        </label>

                        <label class="filter-item">
                            <input
                                type="radio"
                                name="mapStyle"
                                value="atlas"
                            >
                            🎨 Atlas
                        </label>

                        <label class="filter-item">
                            <input
                                type="radio"
                                name="mapStyle"
                                value="satellite"
                            >
                            🛰️ Satellite
                        </label>

                        <div class="separator"></div>

                        <label class="filter-item filter-all">

                            <input
                                type="checkbox"
                                id="allZones"
                                checked
                            >

                            Tous les 10-20

                        </label>

                        <div class="separator"></div>

                        ${lignesCategories}

                    </div>

                </div>
            `;


            L.DomEvent.disableClickPropagation(
                container
            );

            L.DomEvent.disableScrollPropagation(
                container
            );

            return container;
        }
    });


    map.addControl(
        new FiltersControl()
    );


    /* =================================================
       SÉLECTION DU FOND DE CARTE
       ================================================= */

    const boutonsFond =
        document.querySelectorAll(
            'input[name="mapStyle"]'
        );

    boutonsFond.forEach(function(bouton) {

        bouton.addEventListener(
            "change",
            function() {

                changerFond(
                    this.value
                );

            }
        );

    });


    /* =================================================
       OUVRIR / FERMER PANEL
       ================================================= */

    document
        .getElementById("filtersButton")
        .addEventListener(
            "click",
            function() {

                document
                    .getElementById("filtersPanel")
                    .classList
                    .toggle("hidden");

            }
        );


    /* =================================================
       FILTRES
       ================================================= */

    const checkboxes =
        document.querySelectorAll(
            "[data-zone]"
        );


    checkboxes.forEach(function(checkbox) {

        checkbox.addEventListener(
            "change",
            function() {

                const zone =
                    this.dataset.zone;

                // Sur le fond "Routes", les 10-20 restent masqués
                // même si on coche/décoche une catégorie.
                if (fondActuel === fondsCarte.routes) {

                    if (map.hasLayer(groupes[zone])) {
                        map.removeLayer(groupes[zone]);
                    }

                } else if (this.checked) {

                    groupes[zone]
                        .addTo(map);

                } else {

                    map.removeLayer(
                        groupes[zone]
                    );

                }

                verifierTous();
            }
        );

    });


    /* =================================================
       TOUS LES 10-20
       ================================================= */

    document
        .getElementById("allZones")
        .addEventListener(
            "change",
            function() {

                const actif =
                    this.checked;

                checkboxes.forEach(
                    function(checkbox) {

                        checkbox.checked =
                            actif;

                        const zone =
                            checkbox.dataset.zone;

                        // La carte "Routes" reste toujours sans 10-20.
                        if (fondActuel === fondsCarte.routes) {

                            if (map.hasLayer(groupes[zone])) {
                                map.removeLayer(groupes[zone]);
                            }

                        } else if (actif) {

                            groupes[zone]
                                .addTo(map);

                        } else {

                            map.removeLayer(
                                groupes[zone]
                            );

                        }

                    }
                );

            }
        );


    function verifierTous() {

        const tousActifs =
            [...checkboxes].every(
                checkbox =>
                    checkbox.checked
            );

        document
            .getElementById("allZones")
            .checked =
            tousActifs;
    }


    /* =================================================
       ICÔNE COULEUR
       ================================================= */

    function creerIcone(couleur) {

        return L.divIcon({

            className: "",

            html: `
                <div
                    class="map-dot"
                    style="
                        background:
                        ${couleur}
                    "
                ></div>
            `,

            iconSize: [16,16],
            iconAnchor: [8,8],
            popupAnchor: [0,-8]

        });

    }


    /* =================================================
       AJOUT D'UN 10-20
       ================================================= */

    function ajouter1020(
        nom,
        y,
        x,
        zone,
        image = ""
    ) {

        const categorie =
            categories[zone];

        if (!categorie) {

            console.error(
                "Catégorie inconnue :",
                zone
            );

            return;
        }


        const marker =
            L.marker(
                [y,x],
                {
                    icon:
                        creerIcone(
                            categorie.couleur
                        )
                }
            );


        let contenuImage = "";

        if (image !== "") {

            contenuImage = `
                <img
                    class="popup-image"
                    src="${image}"
                    alt="${nom}"
                >
            `;

        }


        marker.bindPopup(`

            <div class="popup-card">

                <div class="popup-title">
                    ${nom}
                </div>

                ${contenuImage}

                <div class="popup-zone">
                    ${categorie.nom}
                </div>

            </div>

        `);


        marker.addTo(
            groupes[zone]
        );

        return marker;
    }


/* =================================================

    /* =================================================
       MODE PLACEMENT

       MAJ + CLIC = coordonnées
       ================================================= */

    map.on(
        "click",
        function(e) {

            if (!e.originalEvent.shiftKey) {
                return;
            }

            const y =
                Math.round(
                    e.latlng.lat * 10
                ) / 10;

            const x =
                Math.round(
                    e.latlng.lng * 10
                ) / 10;


            navigator.clipboard
                .writeText(
                    `${y}, ${x}`
                );


            L.popup({
                closeButton: false
            })
            .setLatLng(
                e.latlng
            )
            .setContent(`
                <div style="
                    text-align:center;
                    font-family:Arial;
                ">
                    <b>Coordonnées copiées</b>
                    <br><br>
                    Y : ${y}
                    <br>
                    X : ${x}
                </div>
            `)
            .openOn(map);

        }
    );
