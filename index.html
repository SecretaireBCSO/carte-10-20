<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carte 10-20</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #2468A8;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .leaflet-container {
            background: #2468A8;
        }

        /* =========================
           PANEL
        ========================= */

        .filters-control {
            font-family: Arial, sans-serif;
        }

        .filters-button {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(17, 30, 48, 0.96);
            color: white;

            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;

            font-size: 22px;
            cursor: pointer;

            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        }

        .filters-button:hover {
            background: #244b70;
        }

        .filters-panel {
            width: 275px;
            margin-top: 8px;

            background: rgba(17, 30, 48, 0.97);
            color: white;

            border-radius: 12px;
            overflow: hidden;

            border: 1px solid rgba(255,255,255,0.12);

            box-shadow: 0 8px 28px rgba(0,0,0,0.4);
        }

        .filters-panel.hidden {
            display: none;
        }

        .filters-header {
            padding: 14px 16px;

            background: rgba(36,104,168,0.35);

            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .filters-title {
            font-size: 15px;
            font-weight: bold;
        }

        .filters-subtitle {
            margin-top: 3px;
            font-size: 11px;
            color: #a9bfd3;
        }

        .filters-list {
            padding: 10px;
        }

        .filter-item {
            display: flex;
            align-items: center;

            padding: 8px;

            border-radius: 7px;

            font-size: 13px;
            cursor: pointer;
        }

        .filter-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .filter-item input {
            width: 16px;
            height: 16px;

            margin-right: 8px;

            cursor: pointer;
        }

        .filter-all {
            font-weight: bold;
        }

        .separator {
            height: 1px;
            margin: 7px 4px;

            background: rgba(255,255,255,0.1);
        }

        .legend-dot {
            width: 11px;
            height: 11px;

            border-radius: 50%;

            margin-right: 8px;

            border: 1px solid rgba(255,255,255,0.8);
        }

        /* =========================
           POINTS SUR LA CARTE
        ========================= */

        .map-dot {
            width: 16px;
            height: 16px;

            border-radius: 50%;

            border: 2px solid #111;

            box-shadow:
                0 1px 4px rgba(0,0,0,0.8),
                0 0 3px rgba(255,255,255,0.5);
        }

        /* =========================
           POPUP 10-20
        ========================= */

        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .leaflet-popup-content {
            margin: 12px;
            width: 300px !important;
        }

        .popup-card {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .popup-title {
            margin-bottom: 9px;

            font-size: 15px;
            font-weight: bold;

            color: #222;
        }

        .popup-image {
            display: block;

            width: 100%;
            height: 165px;

            object-fit: cover;

            border-radius: 9px;
        }

        .popup-zone {
            margin-top: 8px;

            font-size: 11px;

            color: #777;
        }

        /* Frontières */
        .frontiere-row {
            margin-top: 6px;
            padding-top: 8px;

            border-top: 1px solid rgba(255,255,255,0.12);

            font-weight: bold;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    /* =================================================
       CARTE
       ================================================= */

    const map = L.map("map", {
        crs: L.CRS.Simple,
        minZoom: -2,
        maxZoom: 4
    });

    const largeur = 1280;
    const hauteur = 1280;

    const bounds = [
        [0, 0],
        [hauteur, largeur]
    ];

    L.imageOverlay(
        "carte.png",
        bounds
    ).addTo(map);

    map.fitBounds(bounds);


    /* =================================================
       CATÉGORIES
       ================================================= */

    const categories = {

        paletoBay: {
            nom: "Paleto Bay",
            couleur: "#1685FF"
        },

        oceanZancudo: {
            nom: "Ocean Highway / Zancudo",
            couleur: "#7B2CBF"
        },

        route68Harmony: {
            nom: "Route 68 / Harmony",
            couleur: "#35C759"
        },

        sandyJoshua: {
            nom: "Sandy Shores / Joshua Road",
            couleur: "#FF8C24"
        },

        grandSenora: {
            nom: "Grand Senora / Senora Road",
            couleur: "#FFCA28"
        },

        grapeseed: {
            nom: "Grapeseed",
            couleur: "#78D64B"
        },

        senoraFreeway: {
            nom: "Senora Freeway",
            couleur: "#19C4D8"
        },

        chiliadNord: {
            nom: "Mont Chiliad / Nord rural",
            couleur: "#D5D5D5"
        },

        frontieres: {
            nom: "Frontières",
            couleur: "#FF3030"
        }

    };


    /* =================================================
       GROUPES LEAFLET
       ================================================= */

    const groupes = {};

    Object.keys(categories).forEach(function(zone) {

        groupes[zone] =
            L.layerGroup().addTo(map);

    });


    /* =================================================
       PANEL DES FILTRES
       ================================================= */

    const FiltersControl = L.Control.extend({

        options: {
            position: "topright"
        },

        onAdd: function() {

            const container =
                L.DomUtil.create(
                    "div",
                    "filters-control"
                );

            let lignesCategories = "";

            Object.entries(categories)
                .forEach(function([id, categorie]) {

                    const frontiere =
                        id === "frontieres"
                        ? " frontiere-row"
                        : "";

                    lignesCategories += `

                        <label class="filter-item${frontiere}">

                            <input
                                type="checkbox"
                                data-zone="${id}"
                                checked
                            >

                            <span
                                class="legend-dot"
                                style="
                                    background:
                                    ${categorie.couleur}
                                "
                            ></span>

                            ${categorie.nom}

                        </label>
                    `;

                });


            container.innerHTML = `

                <button
                    id="filtersButton"
                    class="filters-button"
                    title="Filtres"
                >
                    ☰
                </button>

                <div
                    id="filtersPanel"
                    class="filters-panel hidden"
                >

                    <div class="filters-header">

                        <div class="filters-title">
                            Filtres 10-20
                        </div>

                        <div class="filters-subtitle">
                            Blaine County / Nord
                        </div>

                    </div>

                    <div class="filters-list">

                        <label class="filter-item filter-all">

                            <input
                                type="checkbox"
                                id="allZones"
                                checked
                            >

                            Tous les 10-20

                        </label>

                        <div class="separator"></div>

                        ${lignesCategories}

                    </div>

                </div>
            `;


            L.DomEvent.disableClickPropagation(
                container
            );

            L.DomEvent.disableScrollPropagation(
                container
            );

            return container;
        }
    });


    map.addControl(
        new FiltersControl()
    );


    /* =================================================
       OUVRIR / FERMER PANEL
       ================================================= */

    document
        .getElementById("filtersButton")
        .addEventListener(
            "click",
            function() {

                document
                    .getElementById("filtersPanel")
                    .classList
                    .toggle("hidden");

            }
        );


    /* =================================================
       FILTRES
       ================================================= */

    const checkboxes =
        document.querySelectorAll(
            "[data-zone]"
        );


    checkboxes.forEach(function(checkbox) {

        checkbox.addEventListener(
            "change",
            function() {

                const zone =
                    this.dataset.zone;

                if (this.checked) {

                    groupes[zone]
                        .addTo(map);

                } else {

                    map.removeLayer(
                        groupes[zone]
                    );

                }

                verifierTous();
            }
        );

    });


    /* =================================================
       TOUS LES 10-20
       ================================================= */

    document
        .getElementById("allZones")
        .addEventListener(
            "change",
            function() {

                const actif =
                    this.checked;

                checkboxes.forEach(
                    function(checkbox) {

                        checkbox.checked =
                            actif;

                        const zone =
                            checkbox.dataset.zone;

                        if (actif) {

                            groupes[zone]
                                .addTo(map);

                        } else {

                            map.removeLayer(
                                groupes[zone]
                            );

                        }

                    }
                );

            }
        );


    function verifierTous() {

        const tousActifs =
            [...checkboxes].every(
                checkbox =>
                    checkbox.checked
            );

        document
            .getElementById("allZones")
            .checked =
            tousActifs;
    }


    /* =================================================
       ICÔNE COULEUR
       ================================================= */

    function creerIcone(couleur) {

        return L.divIcon({

            className: "",

            html: `
                <div
                    class="map-dot"
                    style="
                        background:
                        ${couleur}
                    "
                ></div>
            `,

            iconSize: [16,16],
            iconAnchor: [8,8],
            popupAnchor: [0,-8]

        });

    }


    /* =================================================
       AJOUT D'UN 10-20
       ================================================= */

    function ajouter1020(
        nom,
        y,
        x,
        zone,
        image = ""
    ) {

        const categorie =
            categories[zone];

        if (!categorie) {

            console.error(
                "Catégorie inconnue :",
                zone
            );

            return;
        }


        const marker =
            L.marker(
                [y,x],
                {
                    icon:
                        creerIcone(
                            categorie.couleur
                        )
                }
            );


        let contenuImage = "";

        if (image !== "") {

            contenuImage = `
                <img
                    class="popup-image"
                    src="${image}"
                    alt="${nom}"
                >
            `;

        }


        marker.bindPopup(`

            <div class="popup-card">

                <div class="popup-title">
                    ${nom}
                </div>

                ${contenuImage}

                <div class="popup-zone">
                    ${categorie.nom}
                </div>

            </div>

        `);


        marker.addTo(
            groupes[zone]
        );

        return marker;
    }


/* =================================================
   PALETO BAY
   ================================================= */

ajouter1020("Scierie", 962.8, 529, "paletoBay");
ajouter1020("Téléphérique", 987.9, 509.8, "paletoBay");
ajouter1020("PDP Paleto", 1033.6, 540.9, "paletoBay");
ajouter1020("Station Essence Paleto", 1095.1, 602, "paletoBay");
ajouter1020("Usine Poulet", 1057.1, 580.3, "paletoBay");
ajouter1020("La Pointe", 1154, 594.8, "paletoBay");
ajouter1020("Diner", 1074.6, 764.2, "paletoBay");


/* =================================================
   OCEAN HIGHWAY / ZANCUDO
   ================================================= */

ajouter1020("Vigneron", 626.1, 393.8, "oceanZancudo");
ajouter1020("Totem", 631.2, 425.9, "oceanZancudo");
ajouter1020("Villa Rouge", 610.7, 322.3, "oceanZancudo");
ajouter1020("Station Essence Zancudo", 654.3, 326.5, "oceanZancudo");
ajouter1020("Fort Zancudo / Base Militaire", 740.9, 358.6, "oceanZancudo");
ajouter1020("Hookies", 853.7, 361.7, "oceanZancudo");


/* =================================================
   ROUTE 68 / HARMONY
   ================================================= */

ajouter1020("Chapelle", 704, 555.9, "route68Harmony");
ajouter1020("Ciment", 709.1, 619.1, "route68Harmony");
ajouter1020("BolingBroke", 679.9, 762.6, "route68Harmony");
ajouter1020("Stab City", 793.2, 594.3, "route68Harmony");
ajouter1020("Ferme aux cochons", 611.8, 579.8, "route68Harmony");
ajouter1020("Mine Abandonnée", 631.2, 526.4, "route68Harmony");


/* =================================================
   SANDY SHORES / JOSHUA ROAD
   ================================================= */

ajouter1020("PDS Sandy", 793.7, 777.6, "sandyJoshua");
ajouter1020("Aéroport Sandy", 749.1, 767.8, "sandyJoshua");
ajouter1020("Yellow Jack", 728.6, 793.7, "sandyJoshua");
ajouter1020("Casse Avion", 731.7, 833.1, "sandyJoshua");
ajouter1020("??", 840.3, 846.5, "sandyJoshua");
ajouter1020("Camp Hippie", 803.5, 841.4, "sandyJoshua");
ajouter1020("Cactus", 769.6, 622.8, "grandSenora");


/* =================================================
   GRAND SENORA / SENORA ROAD
   ================================================= */




/* =================================================
   GRAPESEED
   ================================================= */

ajouter1020("LTD Grapeseed", 922.4, 762.6, "grapeseed");
ajouter1020("Pêcherie", 863.4, 726.4, "grapeseed");
ajouter1020("Aérodrome Grapeseed", 905.4, 798.9, "grapeseed");
ajouter1020("Ferme O'Neil", 930.5, 837.2, "grapeseed");
ajouter1020("Silo", 861.9, 885.9, "grapeseed");


/* =================================================
   SENORA FREEWAY
   ================================================= */

ajouter1020("You Tool", 773.2, 868.3, "senoraFreeway");
ajouter1020("Mine", 705.6, 879.2, "senoraFreeway");
ajouter1020("Éoliennes", 624.6, 821.7, "senoraFreeway");
ajouter1020("Humane Labs", 796.8, 952.2, "senoraFreeway");
ajouter1020("Dino Rose", 683.5, 850.7, "senoraFreeway");


/* =================================================
   MONT CHILIAD / NORD RURAL
   ================================================= */

ajouter1020("Nudistes", 920.8, 474.6, "chiliadNord");
ajouter1020("Maison Weed", 990, 817, "chiliadNord");
ajouter1020("Mont Chiliad", 984.9, 638.3, "chiliadNord");
ajouter1020("Phare", 946.9, 941.3, "chiliadNord");
ajouter1020("Maison Pêcheur", 873.7, 977.6, "chiliadNord");


/* =================================================
   FRONTIÈRES
   ================================================= */

// Tes points de frontières seront ajoutés ici.


    /* =================================================
       MODE PLACEMENT

       MAJ + CLIC = coordonnées
       ================================================= */

    map.on(
        "click",
        function(e) {

            if (!e.originalEvent.shiftKey) {
                return;
            }

            const y =
                Math.round(
                    e.latlng.lat * 10
                ) / 10;

            const x =
                Math.round(
                    e.latlng.lng * 10
                ) / 10;


            navigator.clipboard
                .writeText(
                    `${y}, ${x}`
                );


            L.popup({
                closeButton: false
            })
            .setLatLng(
                e.latlng
            )
            .setContent(`
                <div style="
                    text-align:center;
                    font-family:Arial;
                ">
                    <b>Coordonnées copiées</b>
                    <br><br>
                    Y : ${y}
                    <br>
                    X : ${x}
                </div>
            `)
            .openOn(map);

        }
    );

</script>

</body>
</html>
