<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carte 10-20</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #111;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Création de la carte
    const map = L.map("map", {
        crs: L.CRS.Simple,
        minZoom: -2,
        maxZoom: 4
    });

    // Taille de notre image GTA
    const largeur = 1280;
    const hauteur = 1280;

    const bounds = [
        [0, 0],
        [hauteur, largeur]
    ];

    // Notre image de carte
    L.imageOverlay("carte.png", bounds).addTo(map);

    // Centrer la carte
    map.fitBounds(bounds);

    // Permet de cliquer sur la carte
    // pour connaître les coordonnées
    map.on("click", function(e) {

        const y = Math.round(e.latlng.lat);
        const x = Math.round(e.latlng.lng);

        L.popup()
            .setLatLng(e.latlng)
            .setContent(
                "Coordonnées :<br>" +
                "<b>Y : " + y + "</b><br>" +
                "<b>X : " + x + "</b>"
            )
            .openOn(map);

        console.log("Y :", y, "X :", x);
    });
</script>

</body>
</html>
